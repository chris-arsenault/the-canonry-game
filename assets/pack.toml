#
# The entity-sprites above (section 1) are painted portraits — used on card
# faces and in the entity inspector. The hex map itself renders at small
# scale with variable terrain underneath, so it needs a different register:
# flat silhouettes with bold outlines that read at 32px.
#
# Deliberately no identity — identity text pushes Claude to include
# ice-plate/ember-thread/ritual-scar detail that defeats the purpose of a
# map icon. These are supposed to be stripped, iconographic, not
# culturally-detailed.
# ----------------------------------------------------------------------------

[[section]]
id = "1b-entity-map-icons"
title = "1b · Entity map icons"
# Clean app-icon register + bold primary palette. No identity (cultural

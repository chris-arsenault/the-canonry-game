title = "The Canonry Game"
preset = "glacial-archive"
model = "flux-2-pro"
default_style = "archive"
default_palette = "polar"

[defaults]
size = "1024x1024"
aspect = "1:1"

[style.archive]
name = "Archive Plate"
composition = "centered subject with generous negative space and a museum-plate feel"

[style.cinematic]
name = "Cinematic Plate"
composition = "broader framing, deeper atmosphere, and a stronger sense of scale"

[palette.polar]
name = "Polar"
primary = ["#E7E3D5", "#B8B5A6", "#D97742", "#C9A96B"]
secondary = ["#0B0F14", "#19202C", "#2E3A4F", "#78C9B2", "#B04646"]
notes = "Warm vellum backgrounds, slate shadows, ember as a rare hot accent."

[palette.signal]
name = "Signal"
primary = ["#D97742", "#B04646", "#C9A96B"]
secondary = ["#0B0F14", "#19202C", "#E7E3D5"]
notes = "Higher-contrast palette for UI and iconography."

[type_prompt_fragment]
icon = "Keep the icon silhouette bold, crisp, and readable at 16px."
chrome = "Keep decorative edges controlled and production-friendly for UI extraction."

